<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>iQuyHoach WebGIS · A Olympic</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body,#map{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial}#map{background:#e5e7eb}.top{position:absolute;z-index:1000;top:10px;left:10px;right:10px;min-height:58px;background:#07111fee;color:#fff;border:1px solid #ffffff22;border-radius:17px;display:flex;align-items:center;gap:10px;padding:9px 12px;box-shadow:0 12px 32px #0005}.logo{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#22c55e,#0ea5e9);font-weight:900}.brand b{display:block}.brand small{color:#94a3b8}.search{margin-left:auto;background:#ffffff0d;border:1px solid #ffffff1f;color:#fff;border-radius:11px;padding:10px 12px;width:min(310px,38vw);outline:none}.panel{position:absolute;z-index:999;left:10px;top:82px;bottom:10px;width:300px;background:#07111fee;color:#fff;border:1px solid #ffffff22;border-radius:18px;padding:14px;overflow:auto;box-shadow:0 12px 32px #0005}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#ffffff0b;border:1px solid #ffffff18;border-radius:12px;padding:10px}.stat b{font-size:21px}.muted{color:#94a3b8;font-size:11px}.panel select{width:100%;margin:13px 0;padding:11px;border-radius:10px;background:#0f172a;color:#fff;border:1px solid #ffffff22}.legend{display:grid;grid-template-columns:1fr;gap:6px}.li{display:flex;align-items:flex-start;gap:7px;background:#ffffff08;border-radius:8px;padding:7px;font-size:11px;line-height:1.25}.sw{width:12px;height:12px;border-radius:3px;border:1px solid #fff8}.menu{display:none;position:absolute;z-index:1001;left:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));border:0;background:#07111fee;color:#fff;padding:11px 14px;border-radius:13px;font-weight:700}.tools{position:absolute;z-index:1000;right:10px;top:82px;display:grid;gap:7px}.tool{width:42px;height:42px;border:1px solid #ffffff22;background:#07111fee;color:#fff;border-radius:12px;font-size:18px}.info{position:absolute;z-index:1000;right:10px;bottom:10px;width:260px;background:#07111fee;color:#fff;border:1px solid #ffffff22;border-radius:14px;padding:12px;display:none}.info.show{display:block}.leaflet-control-zoom{display:none}
@media(max-width:720px){.top{padding:8px 9px}.logo{width:36px;height:36px}.brand small{display:none}.brand b{font-size:13px}.search{width:auto;min-width:0;flex:1;padding:9px;font-size:12px}.panel{top:auto;left:10px;right:10px;bottom:68px;width:auto;max-height:58vh;transform:translateY(calc(100% + 90px));opacity:0;pointer-events:none;transition:.22s}.panel.open{transform:none;opacity:1;pointer-events:auto}.menu{display:block}.info{left:10px;right:10px;bottom:68px;width:auto}.legend{grid-template-columns:1fr}.leaflet-control-attribution{font-size:9px!important}}
</style></head><body><div id="map"></div><div class="top"><div class="logo">iQ</div><div class="brand"><b>iQuyHoach WebGIS</b><small>A Olympic · QHPK · Hà Nội</small></div><input id="q" class="search" placeholder="Tìm mã đất, ví dụ 100"></div><div class="panel" id="panel"><div class="stats"><div class="stat"><b id="fc">—</b><div id="fcLabel" class="muted">Đối tượng</div></div><div class="stat"><b id="cc">—</b><div id="ccLabel" class="muted">Nhóm chức năng</div></div></div><div style="margin-top:12px;padding:10px;background:#ffffff0b;border:1px solid #ffffff18;border-radius:10px"><label style="display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700"><input id="toggleCodo" type="checkbox" checked> Quy hoạch xã Cổ Đô</label><div class="muted" style="margin-top:5px">1.129 đối tượng · WGS84 EPSG:4326</div></div><div id="codoLegend" class="legend" style="margin-top:8px"></div><div style="margin-top:12px;padding:10px;background:#ffffff0b;border:1px solid #ffffff18;border-radius:10px"><label style="display:flex;gap:8px;align-items:center;font-size:12px;font-weight:700"><input id="toggleGDB" type="checkbox"> QuyHoach.gdb · Chức năng sử dụng đất</label><div class="muted" style="margin-top:5px">5.088 vùng · A Olympic</div></div><div id="gdbLegend" class="legend" style="margin-top:8px"></div><div style="margin-top:12px"><b>Lớp A Olympic · mã loại đất</b><select id="filter"><option value="">Tất cả mã đất</option></select><div class="legend" id="legend"></div></div><p class="muted">Nguồn hiển thị: Quy hoạch xã Cổ Đô · Shapefile WGS84</p><a href="XaCoDo_iquyhoachQHC_HaNoi_WGS84_WebGIS_REV2_DUONG100.zip" target="_blank" rel="noopener" style="display:block;margin-top:10px;padding:11px 12px;border-radius:10px;background:#22c55e;color:#07111f;font-weight:700;text-decoration:none;text-align:center">⇩ Tải hồ sơ quy hoạch xã Cổ Đô (ZIP)</a><a href="https://github.com/phungquangquang/inhaithinh/releases/download/gis-hoso-2026-10-04/HoSoGIS_A_Olympic.zip" target="_blank" rel="noopener" style="display:block;margin-top:8px;padding:10px 12px;border-radius:10px;background:#ffffff12;color:#fff;font-weight:700;text-decoration:none;text-align:center">Tải hồ sơ GIS A Olympic (49,6 MB)</a></div><button class="menu" id="menu">☰ Lớp dữ liệu</button><div id="baseLabel" style="position:absolute;z-index:1000;right:60px;top:88px;background:#07111fee;color:#fff;border:1px solid #ffffff22;border-radius:10px;padding:7px 10px;font-size:11px;white-space:nowrap">Google Vệ tinh</div><div class="tools"><button class="tool" id="zin">＋</button><button class="tool" id="zout">−</button><button class="tool" id="home">⌂</button><button class="tool" id="base">◫</button></div><div class="info" id="info"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(async()=>{
  const D=await fetch('a_olympic.json?v=original2315').then(r=>{
    if(!r.ok) throw new Error('Không tải được a_olympic.json ('+r.status+')');
    return r.json();
  });
  const gr=await fetch('quyhoach_sdd.geojson.gz.b64?v=gdb5088');
  if(!gr.ok) throw new Error('Không tải được lớp QuyHoach.gdb ('+gr.status+')');
  const encoded=(await gr.text()).trim(), raw=atob(encoded);
  const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
  const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  const G=await new Response(stream).json();

  const cr=await fetch('xacodo.geojson.gz.b64?v=codo1129');
  if(!cr.ok) throw new Error('Không tải được dữ liệu xã Cổ Đô ('+cr.status+')');
  const encC=(await cr.text()).trim(), rawC=atob(encC);
  const bytesC=Uint8Array.from(rawC,c=>c.charCodeAt(0));
  const streamC=new Blob([bytesC]).stream().pipeThrough(new DecompressionStream('gzip'));
  const C=await new Response(streamC).json();

  const map=L.map('map',{zoomControl:false,preferCanvas:true});

  const baseNames=['Google Vệ tinh','Google Hybrid','Đường phố'];
  const bases=[
    L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{maxZoom:21,attribution:'© Google'}),
    L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}',{maxZoom:21,attribution:'© Google'}),
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'})
  ];
  let bi=0;
  bases[bi].addTo(map);
  document.getElementById('baseLabel').textContent=baseNames[bi];

  const names={"1":"Đất Trường học","3":"Đất Công trình Y tế","5":"Đất dịch vụ, Thương Mại","6":"Đất Trung tâm Thể dục thể thao","7":"Đất Cây xanh, công viên, vườn hoa","11":"Đất Cơ quan, Viện nghiên cứu, Trường đào tạo","12":"Đất Di tích, Tôn giáo – Tín ngưỡng","13":"ĐẤT SỬ DỤNG VÀO MỤC ĐÍCH ĐẶC BIỆT","16":"Đất Bãi đỗ xe","57":"Đất Văn hóa","78":"Đất cây xanh chuyên dùng (Trồng hoa, Nông nghiệp Công nghệ cao)","93":"Đất ở cao tầng","100":"Đất giao thông","101":"Đất Trung tâm đào tạo, nghiên cứu","102":"Đất Trường THPT","155":"Đất công trình hạ tầng kỹ thuật khác","170":"HỒ, AO, ĐẦM, SÔNG, SUỐI, KÊNH RẠCH","922":"Đất nhà ở liền kề","933":"Đất nhà ở biệt thự","971":"ĐẤT CÂY XANH ĐÔ THỊ, CÂY XANH SỬ DỤNG CÔNG CỘNG","6661":"Logo iquyhoach","6662":"Logo iquyhoach","6666":"Logo iquyhoach"};const colors={"1":"#ff00bf","3":"#d4531c","5":"#995f4c","6":"#7ca500","7":"#00a500","11":"#7f3f00","12":"#ff7f7f","13":"#7f7f00","16":"#898989","57":"#f4996c","78":"#00cc99","93":"#e6a519","100":"#d2d2d2","101":"#007299","102":"#cc00cc","155":"#8ca8ba","170":"#0066CC","922":"#efa748","933":"#e7d35f","971":"#66CC00","6661":"#00FF00","6662":"#0000FF","6666":"#FF0000"};const opacity={"100":0.5};
  const codes=[...new Set(D.features.map(f=>String(f.properties.ky_hieu)))].sort((a,b)=>+a-+b);

  document.getElementById('fc').textContent=D.features.length.toLocaleString('vi-VN');
  document.getElementById('cc').textContent=codes.length;

  let curFilter='';
  const style=f=>{
    const k=String(f.properties.ky_hieu), active=!curFilter||k===curFilter;
    return {
      color:active?'#111827':'#64748b',
      weight:active?0.7:0.2,
      fillColor:colors[k]||'#94a3b8',
      fillOpacity:active?(opacity[k]??0.78):0.04
    };
  };

  const info=document.getElementById('info');
  const g=L.geoJSON(D,{
    style,
    smoothFactor:0,
    onEachFeature:(f,l)=>l.on('click',()=>{
      const k=String(f.properties.ky_hieu);
      info.innerHTML=
        '<b style="font-size:16px;color:'+(colors[k]||'#fff')+'">'+(names[k]||('Mã '+k))+'</b>'+
        '<div style="margin-top:7px">Mã loại đất: <b>'+k+'</b></div><div>Phân khu: <b>'+(f.properties.phan_khu||'-')+'</b></div>'+
        '<div>Ghi chú: <b>'+(f.properties.ghi_chu||'-')+'</b></div>'+
        '<div class="muted" style="margin-top:7px">Nguồn: A Olympic_iquyhoachQHPK</div>';
      info.classList.add('show');
    })
  }).addTo(map);

  const groupName=f=>String(f.properties.phanLoaiTB||f.properties.phanLoai||'Chưa phân loại');
  const groups=[...new Set(G.features.map(groupName))].sort((a,b)=>a.localeCompare(b,'vi'));
  const palette=['#22c55e','#60a5fa','#f59e0b','#e879f9','#14b8a6','#fb7185','#a3e635','#818cf8','#f97316','#38bdf8','#c084fc','#facc15','#4ade80','#f472b6','#2dd4bf','#94a3b8'];
  const groupColors=new Map(groups.map((n,i)=>[n,palette[i%palette.length]]));
  const esc=v=>String(v??'-').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const gdb=L.geoJSON(G,{
    style:f=>({color:'#334155',weight:.35,fillColor:groupColors.get(groupName(f)),fillOpacity:.72}),
    smoothFactor:.15,
    onEachFeature:(f,l)=>l.on('click',()=>{
      const p=f.properties, rows=[
        ['Chức năng',groupName(f)],['Tên đối tượng',p.ten],['Mã đối tượng',p.maDoiTuong],
        ['Mã ô quy hoạch',p.maOQH],['Diện tích',p.dienTich],['Mật độ xây dựng',p.MDXDMin||p.MDXDMax],
        ['Tầng cao',p.tangCaoMin||p.tangCaoMax],['Hệ số sử dụng đất',p.heSoSDD],['Ghi chú',p.ghiChu]
      ];
      info.innerHTML='<b style="font-size:16px;color:'+groupColors.get(groupName(f))+'">'+esc(groupName(f))+'</b>'+
        rows.filter(r=>r[1]&&r[1]!=='-').map(r=>'<div style="margin-top:5px">'+esc(r[0])+': <b>'+esc(r[1])+'</b></div>').join('')+
        '<div class="muted" style="margin-top:7px">Nguồn: QuyHoach.gdb · Chức năng sử dụng đất</div>';
      info.classList.add('show');
    })
  }).addTo(map);
  map.removeLayer(g);
  document.getElementById('fc').textContent=G.features.length.toLocaleString('vi-VN');
  document.getElementById('cc').textContent=groups.length.toLocaleString('vi-VN');
  const gleg=document.getElementById('gdbLegend');
  groups.forEach(n=>{
    const count=G.features.filter(f=>groupName(f)===n).length;
    gleg.insertAdjacentHTML('beforeend','<div class="li"><i class="sw" style="background:'+groupColors.get(n)+'"></i><span>'+esc(n)+' <span class="muted">· '+count.toLocaleString('vi-VN')+'</span></span></div>');
  });
  const codoCodes=[...new Set(C.features.map(f=>String(f.properties.ky_hieu)))].sort((a,b)=>+a-+b);
  const codoColors=new Map(codoCodes.map((k,i)=>[k,colors[k]||palette[i%palette.length]]));
  const codo=L.geoJSON(C,{
    style:f=>({color:'#1f2937',weight:.45,fillColor:codoColors.get(String(f.properties.ky_hieu)),fillOpacity:.78}),
    smoothFactor:.15,
    onEachFeature:(f,l)=>l.on('click',()=>{
      const p=f.properties,k=String(p.ky_hieu);
      info.innerHTML='<b style="font-size:16px;color:'+codoColors.get(k)+'">'+esc(names[k]||('Mã '+k))+'</b>'+
        '<div style="margin-top:7px">Mã ký hiệu: <b>'+esc(k)+'</b></div>'+
        '<div>Phân khu: <b>'+esc(p.phan_khu)+'</b></div>'+
        '<div>Ghi chú: <b>'+esc(p.ghi_chu)+'</b></div>'+
        '<div class="muted" style="margin-top:7px">Nguồn: Quy hoạch xã Cổ Đô · WGS84</div>';
      info.classList.add('show');
    })
  }).addTo(map);
  document.getElementById('fc').textContent=C.features.length.toLocaleString('vi-VN');
  document.getElementById('cc').textContent=codoCodes.length.toLocaleString('vi-VN');
  document.getElementById('fcLabel').textContent='Polygon';
  document.getElementById('ccLabel').textContent='Mã loại đất';
  const cleg=document.getElementById('codoLegend');
  codoCodes.forEach(k=>{
    const count=C.features.filter(f=>String(f.properties.ky_hieu)===k).length;
    cleg.insertAdjacentHTML('beforeend','<div class="li"><i class="sw" style="background:'+codoColors.get(k)+'"></i><span><b>'+esc(k)+'</b> · '+esc(names[k]||('Mã '+k))+' <span class="muted">· '+count.toLocaleString('vi-VN')+'</span></span></div>');
  });
  map.removeLayer(gdb);
  const updateStats=()=>{
    const isCodo=document.getElementById('toggleCodo').checked;
    const isGdb=document.getElementById('toggleGDB').checked;
    const count=isCodo?C.features.length:(isGdb?G.features.length:D.features.length);
    const categories=isCodo?codoCodes.length:(isGdb?groups.length:codes.length);
    document.getElementById('fc').textContent=count.toLocaleString('vi-VN');
    document.getElementById('cc').textContent=categories.toLocaleString('vi-VN');
    document.getElementById('fcLabel').textContent=isCodo?'Polygon':'Đối tượng';
    document.getElementById('ccLabel').textContent=isCodo?'Mã loại đất':'Nhóm chức năng';
  };
  document.getElementById('toggleCodo').onchange=e=>{
    if(e.target.checked){codo.addTo(map);fit(codo);}
    else{map.removeLayer(codo);if(document.getElementById('toggleGDB').checked)fit(gdb);else{g.addTo(map);fit(g);}}
    updateStats();
  };
  document.getElementById('toggleGDB').onchange=e=>{
    if(e.target.checked){if(map.hasLayer(g))map.removeLayer(g);gdb.addTo(map);fit(gdb);}
    else{map.removeLayer(gdb);if(!document.getElementById('toggleCodo').checked){g.addTo(map);fit(g);}}
    updateStats();
  };

  function fit(layer=g){
    const b=layer.getBounds();
    if(!b || !b.isValid()) return;
    if(innerWidth<=720){
      map.fitBounds(b,{paddingTopLeft:[18,85],paddingBottomRight:[18,100],maxZoom:17});
    }else{
      map.fitBounds(b,{paddingTopLeft:[330,90],paddingBottomRight:[60,60],maxZoom:17});
    }
  }
  fit(codo);

  const sel=document.getElementById('filter');
  const leg=document.getElementById('legend');
  codes.forEach(k=>{
    sel.insertAdjacentHTML('beforeend','<option value="'+k+'">'+k+' · '+(names[k]||('Mã '+k))+'</option>');
    leg.insertAdjacentHTML('beforeend','<div class="li" title="'+(names[k]||'')+'"><i class="sw" style="background:'+(colors[k]||'#94a3b8')+'"></i><span><b>'+k+'</b> · '+(names[k]||('Mã '+k))+'</span></div>');
  });

  function applyFilter(k){
    curFilter=k;
    g.setStyle(style);
    if(k){
      const a=[];
      g.eachLayer(l=>{ if(String(l.feature.properties.ky_hieu)===k) a.push(l); });
      if(a.length) fit(L.featureGroup(a));
    }else fit();
  }

  sel.onchange=e=>applyFilter(e.target.value);
  document.getElementById('q').onkeydown=e=>{
    if(e.key==='Enter'){
      const v=e.target.value.trim();
      sel.value=v;
      applyFilter(v);
    }
  };

  document.getElementById('menu').onclick=()=>{
    const p=document.getElementById('panel'), b=document.getElementById('menu');
    p.classList.toggle('open');
    b.textContent=p.classList.contains('open')?'✕ Đóng':'☰ Lớp dữ liệu';
    setTimeout(()=>map.invalidateSize(),250);
  };
  document.getElementById('zin').onclick=()=>map.zoomIn();
  document.getElementById('zout').onclick=()=>map.zoomOut();
  document.getElementById('home').onclick=()=>fit();
  document.getElementById('base').onclick=()=>{
    map.removeLayer(bases[bi]);
    bi=(bi+1)%bases.length;
    bases[bi].addTo(map);
    if(map.hasLayer(g)) g.bringToFront();
    document.getElementById('baseLabel').textContent=baseNames[bi];
  };

  window.addEventListener('resize',()=>map.invalidateSize());
})().catch(e=>{
  document.body.insertAdjacentHTML('beforeend',
    '<div style="position:fixed;z-index:9999;left:12px;right:12px;top:90px;background:#7f1d1d;color:white;padding:14px;border-radius:14px;font:14px system-ui">Lỗi WebGIS: '+e.message+'</div>');
  console.error(e);
});
</script></body></html>
