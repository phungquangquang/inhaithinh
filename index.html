<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>iQuyHoach WebGIS · A Olympic</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body,#map{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial}#map{background:#e5e7eb}.top{position:absolute;z-index:1000;top:10px;left:10px;right:10px;min-height:58px;background:#07111fee;color:#fff;border:1px solid #ffffff22;border-radius:17px;display:flex;align-items:center;gap:10px;padding:9px 12px;box-shadow:0 12px 32px #0005}.logo{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,#22c55e,#0ea5e9);font-weight:900}.brand b{display:block}.brand small{color:#94a3b8}.search{margin-left:auto;background:#ffffff0d;border:1px solid #ffffff1f;color:#fff;border-radius:11px;padding:10px 12px;width:min(310px,38vw);outline:none}.panel{position:absolute;z-index:999;left:10px;top:82px;bottom:10px;width:300px;background:#07111fee;color:#fff;border:1px solid #ffffff22;border-radius:18px;padding:14px;overflow:auto;box-shadow:0 12px 32px #0005}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#ffffff0b;border:1px solid #ffffff18;border-radius:12px;padding:10px}.stat b{font-size:21px}.muted{color:#94a3b8;font-size:11px}.panel select{width:100%;margin:13px 0;padding:11px;border-radius:10px;background:#0f172a;color:#fff;border:1px solid #ffffff22}.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px}.li{display:flex;align-items:center;gap:7px;background:#ffffff08;border-radius:8px;padding:7px;font-size:11px}.sw{width:12px;height:12px;border-radius:3px;border:1px solid #fff8}.menu{display:none;position:absolute;z-index:1001;left:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));border:0;background:#07111fee;color:#fff;padding:11px 14px;border-radius:13px;font-weight:700}.tools{position:absolute;z-index:1000;right:10px;top:82px;display:grid;gap:7px}.tool{width:42px;height:42px;border:1px solid #ffffff22;background:#07111fee;color:#fff;border-radius:12px;font-size:18px}.base-label{position:absolute;z-index:1000;right:60px;top:224px;background:#07111fee;color:#fff;border:1px solid #ffffff22;border-radius:10px;padding:7px 9px;font-size:11px;pointer-events:none}.info{position:absolute;z-index:1000;right:10px;bottom:10px;width:260px;background:#07111fee;color:#fff;border:1px solid #ffffff22;border-radius:14px;padding:12px;display:none}.info.show{display:block}.leaflet-control-zoom{display:none}
@media(max-width:720px){.base-label{right:58px;top:224px}.top{padding:8px 9px}.logo{width:36px;height:36px}.brand small{display:none}.brand b{font-size:13px}.search{width:auto;min-width:0;flex:1;padding:9px;font-size:12px}.panel{top:auto;left:10px;right:10px;bottom:68px;width:auto;max-height:58vh;transform:translateY(calc(100% + 90px));opacity:0;pointer-events:none;transition:.22s}.panel.open{transform:none;opacity:1;pointer-events:auto}.menu{display:block}.info{left:10px;right:10px;bottom:68px;width:auto}.legend{grid-template-columns:1fr 1fr}.leaflet-control-attribution{font-size:9px!important}}
</style></head><body><div id="map"></div><div class="top"><div class="logo">iQ</div><div class="brand"><b>iQuyHoach WebGIS</b><small>A Olympic · QHPK · Hà Nội</small></div><input id="q" class="search" placeholder="Tìm mã đất, ví dụ 100"></div><div class="panel" id="panel"><div class="stats"><div class="stat"><b id="fc">—</b><div class="muted">Polygon</div></div><div class="stat"><b id="cc">—</b><div class="muted">Mã loại đất</div></div></div><select id="filter"><option value="">Tất cả mã đất</option></select><b>Chú giải</b><div class="legend" id="legend"></div><p class="muted">Nguồn: A Olympic_iquyhoachQHPK · WGS84 EPSG:4326</p></div><button class="menu" id="menu">☰ Lớp dữ liệu</button><div class="tools"><button class="tool" id="zin">＋</button><button class="tool" id="zout">−</button><button class="tool" id="home">⌂</button><button class="tool" id="base" title="Đổi nền: Đường phố / Vệ tinh / Địa hình">◫</button></div><div class="base-label" id="baseLabel">Đường phố</div><div class="info" id="info"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(async()=>{const D=await fetch('a_olympic.json?v=full2315').then(r=>r.json());const map=L.map('map',{zoomControl:false,preferCanvas:false,renderer:L.svg({padding:.5})});
const bases=[
  {name:'Đường phố',layer:L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'})},
  {name:'Vệ tinh',layer:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles © Esri'})},
  {name:'Địa hình',layer:L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'© OpenTopoMap'})}
];let bi=0;bases[0].layer.addTo(map);
const colors={'1':'#e53935','3':'#ff9800','5':'#ffd54f','6':'#fff176','7':'#f48fb1','11':'#ce93d8','12':'#ab47bc','13':'#7e57c2','16':'#42a5f5','57':'#26a69a','78':'#66bb6a','93':'#8d6e63','100':'#9e9e9e','101':'#78909c','102':'#607d8b','155':'#26c6da','170':'#29b6f6','922':'#ec407a','933':'#5c6bc0','971':'#bdbdbd','6661':'#ff7043','6662':'#8bc34a','6666':'#d4e157'};const codes=[...new Set(D.features.map(f=>String(f.properties.ky_hieu)))].sort((a,b)=>+a-+b);document.getElementById('fc').textContent=D.features.length.toLocaleString('vi-VN');document.getElementById('cc').textContent=codes.length;let cur='';const style=f=>{const k=String(f.properties.ky_hieu),a=!cur||k===cur;return{color:a?'#111827':'#64748b',weight:a?.65:.2,fillColor:colors[k]||'#94a3b8',fillOpacity:a?.76:.04,smoothFactor:0,noClip:false,lineJoin:'round'}};const info=document.getElementById('info');const g=L.geoJSON(D,{style,smoothFactor:0,onEachFeature:(f,l)=>l.on('click',()=>{const k=String(f.properties.ky_hieu);info.innerHTML='<b style="font-size:17px;color:'+(colors[k]||'#fff')+'">Mã '+k+'</b><div style="margin-top:7px">Phân khu: <b>TTE</b></div><div>Ghi chú: <b>iquyhoachQHPK</b></div>';info.classList.add('show')})}).addTo(map);function fit(layer=g){const b=layer.getBounds();if(innerWidth<=720)map.fitBounds(b,{paddingTopLeft:[18,85],paddingBottomRight:[18,100],maxZoom:17});else map.fitBounds(b,{paddingTopLeft:[330,90],paddingBottomRight:[60,60],maxZoom:17})}fit();const sel=document.getElementById('filter'),leg=document.getElementById('legend');codes.forEach(k=>{sel.insertAdjacentHTML('beforeend','<option value="'+k+'">Mã '+k+'</option>');leg.insertAdjacentHTML('beforeend','<div class="li"><i class="sw" style="background:'+(colors[k]||'#94a3b8')+'"></i>Mã '+k+'</div>')});function filter(k){cur=k;g.setStyle(style);if(k){const a=[];g.eachLayer(l=>{if(String(l.feature.properties.ky_hieu)===k)a.push(l)});if(a.length)fit(L.featureGroup(a))}else fit()}sel.onchange=e=>filter(e.target.value);document.getElementById('q').onkeydown=e=>{if(e.key==='Enter'){const v=e.target.value.trim();sel.value=v;filter(v)}};document.getElementById('menu').onclick=()=>{const p=document.getElementById('panel'),b=document.getElementById('menu');p.classList.toggle('open');b.textContent=p.classList.contains('open')?'✕ Đóng':'☰ Lớp dữ liệu';};document.getElementById('zin').onclick=()=>map.zoomIn();document.getElementById('zout').onclick=()=>map.zoomOut();document.getElementById('home').onclick=()=>fit();document.getElementById('base').onclick=()=>{
  map.removeLayer(bases[bi].layer);
  bi=(bi+1)%bases.length;
  bases[bi].layer.addTo(map);
  document.getElementById('baseLabel').textContent=bases[bi].name;
  if(map.hasLayer(g))g.bringToFront();
};})().catch(e=>{document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;z-index:9999;inset:20px;background:#111827;color:white;padding:20px;border-radius:14px">Không tải được dữ liệu: '+e.message+'</div>')});
</script></body></html>
